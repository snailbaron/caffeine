repos:
  - repo: local
    hooks:
      - id: go-mod-tidy
        name: go-mod-tidy
        entry: go mod tidy
        language: system
        pass_filenames: false

      - id: Gazelle
        name: Gazelle
        entry: bazel run //:gazelle
        language: system
        pass_filenames: false

      - id: bazel-mod-tidy
        name: bazel-mod-tidy
        entry: bazel mod tidy
        language: system
        pass_filenames: false

      - id: bazel-update-lockfile
        name: Update Bazel lockfile
        entry: bazel mod deps --lockfile_mode=update
        language: system
        pass_filenames: false
